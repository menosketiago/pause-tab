<!doctype html>
<html id="pause-tab-popup">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pause Tab Settings</title>

        <link rel="stylesheet" href="../styles/index.css" />
    </head>
    <body>
        <div id="message"></div>

        <section>
            <h2>Untracked domains</h2>

            <div class="blacklist-list" id="container-blacklist">
                <div class="empty-state">No domains blacklisted</div>
            </div>

            <button class="pause-tab-btn destructive" id="btn-clear-all">
                Remove all domains
            </button>
        </section>

        <section>
            <h2>Add untracked domain</h2>

            <div class="add-domain">
                <input
                    type="text"
                    id="input-add-domain"
                    placeholder="example.com"
                    autocomplete="off"
                />
                <button class="pause-tab-btn primary" id="btn-add-domain">
                    Add
                </button>
            </div>
        </section>

        <script src="../scripts/popup.js"></script>
    </body>
</html>
