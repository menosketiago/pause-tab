<!doctype html>
<html id="pause-tab-popup">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pause Tab Settings</title>

    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/popup.css" />
</head>

<body class="bg-image">
    <div id="pages-wrapper">
        <div id="page-main">
            <section class="stats">
                <output id="stats-big-number">--</output>

                <p><span id="stats-unit">minutes</span> spent on<br><strong id="stats-domain"></strong> today</p>

                <div id="pill-tracking-disabled" class="pause-tab-pill is-hidden">Tracking disabled</div>
            </section>

            <section>
                <button class="pause-tab-btn primary" id="btn-pause-tab">
                    Pause tab
                </button>

                <button class="pause-tab-btn secondary" id="btn-blacklist-tab">
                    Don't track this site
                </button>
                <button class="pause-tab-btn secondary is-hidden" id="btn-track-tab">
                    Resume tracking this site
                </button>
            </section>

            <button id="btn-manage-sites" class="pause-tab-btn is-hidden">Manage untracked sites →</button>
        </div>

        <div id="page-manage-sites">
            <header>
                <h1>Untracked sites</h1>

                <button id="btn-back" class="pause-tab-btn secondary close" aria-label="Back"></button>
            </header>

            <div class="blacklist-list" id="container-blacklist">
                <div class="empty-state" id="blacklist-empty-state">All sites are being tracked 🕵️‍♀️</div>
            </div>

            <button class="pause-tab-btn destructive is-hidden" id="btn-clear-all">
                Remove all
            </button>

            <div id="message"></div>
        </div>
    </div>

    <script src="../scripts/popup.js"></script>
</body>

</html>
