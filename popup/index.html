<!doctype html>
<html id="pause-tab-popup">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pause Tab Settings</title>

    <link rel="stylesheet" href="../styles/index.css" />
</head>

<body>
    <section>
        <button class="pause-tab-btn primary" id="btn-pause-tab">
            Pause this tab
        </button>

        <button class="pause-tab-btn" id="btn-blacklist-tab">
            Don't time track this site
        </button>
        <button class="pause-tab-btn hidden" id="btn-track-tab">
            Track this site again
        </button>
    </section>

    <section class="hidden" id="section-blacklist">
        <h2>Sites not being tracked</h2>

        <div class="blacklist-list" id="container-blacklist"></div>

        <button class="pause-tab-btn destructive hidden" id="btn-clear-all">
            Remove all domains
        </button>
    </section>

    <div id="message"></div>

    <script src="../scripts/popup.js"></script>
</body>

</html>
